<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Francio House · numeri</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#d3166d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Numeri" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <style>
      @font-face { font-family: 'Bricolage'; src: url('/fonts/bricolage.woff2') format('woff2'); font-weight: 200 800; font-stretch: 75% 100%; }
      @font-face { font-family: 'Mono'; src: url('/fonts/mono-400.woff2') format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Mono'; src: url('/fonts/mono-700.woff2') format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Marker'; src: url('/fonts/marker.woff2') format('woff2'); }

      :root {
        --ink: #15101a;
        --paper: #fbf6ec;
        --paper-2: #f1e8d8;
        --magenta: #d3166d;
        --mint: #93e2b7;
        --pink: #f28dba;
        --uv: #170f55;
        --sun: #ffd23f;
        --sky: #74c6f4;
        --leaf: #1f7a3c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper-2);
        color: var(--ink);
        font-family: 'Bricolage', system-ui, sans-serif;
        font-size: 16px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      .mono { font-family: 'Mono', ui-monospace, monospace; }
      .hand { font-family: 'Marker', cursive; }

      header {
        background: var(--magenta);
        color: var(--paper);
        padding: 22px clamp(16px, 4vw, 48px) 0;
        position: relative;
        overflow: hidden;
      }
      .fringe { display: flex; height: 38px; margin: 18px calc(-1 * clamp(16px, 4vw, 48px)) 0; }
      .fringe i { flex: 1; background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 5px); mask: linear-gradient(#000 0, #000 60%, transparent); -webkit-mask: linear-gradient(#000 0, #000 60%, transparent); }
      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; justify-content: space-between; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 800; font-stretch: 75%; line-height: 0.9; letter-spacing: -0.03em; }
      h1 span { font-weight: 300; }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .pill {
        font: 700 0.8rem 'Mono', monospace; text-transform: uppercase;
        padding: 9px 16px; border-radius: 999px; border: 2px solid var(--paper); background: transparent; color: var(--paper); cursor: pointer;
      }
      .pill[aria-pressed='true'] { background: var(--paper); color: var(--ink); }
      .pill:hover { background: var(--sun); color: var(--ink); border-color: var(--sun); }
      .stamp { font: 0.72rem 'Mono', monospace; opacity: 0.85; }
      .demo { background: var(--sun); color: var(--ink); font: 700 0.72rem 'Mono', monospace; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; }

      main { padding: 28px clamp(16px, 4vw, 48px) 64px; display: grid; gap: 22px; max-width: 1280px; margin: 0 auto; }
      .warn { background: var(--sun); border: 2px solid var(--ink); border-radius: 10px; padding: 12px 16px; font: 0.85rem 'Mono', monospace; }
      .grid { display: grid; gap: 22px; }
      .kpis { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
      .two { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
      .three { grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }

      .card {
        background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 18px 20px 20px;
        box-shadow: 5px 5px 0 var(--ink);
      }
      .card h2 { margin: 0 0 14px; font-size: 1.05rem; font-weight: 800; letter-spacing: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
      .card h2 small { font: 0.72rem 'Mono', monospace; font-weight: 400; opacity: 0.6; }
      .kpi { padding: 16px 18px; }
      .kpi .n { font-size: clamp(2.4rem, 5vw, 3.4rem); font-weight: 800; font-stretch: 75%; line-height: 1; letter-spacing: -0.03em; }
      .kpi .l { font: 0.74rem 'Mono', monospace; text-transform: uppercase; margin-top: 6px; }
      .kpi .s { font-size: 0.85rem; opacity: 0.7; margin-top: 2px; }
      .k1 { background: var(--mint); } .k2 { background: var(--pink); } .k3 { background: var(--sky); } .k4 { background: var(--sun); } .k5 { background: var(--paper); }

      svg { display: block; width: 100%; height: auto; overflow: visible; }
      .chart text { font: 11px 'Mono', monospace; fill: var(--ink); opacity: 0.6; }
      .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font: 0.78rem 'Mono', monospace; padding: 6px 10px; border-radius: 6px; z-index: 9; opacity: 0; transition: opacity 0.1s; white-space: nowrap; }

      ul.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
      ul.list li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; font-size: 0.92rem; }
      ul.list .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      ul.list .val { font: 700 0.85rem 'Mono', monospace; }
      ul.list .bar { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: rgb(21 16 26 / 0.08); overflow: hidden; }
      ul.list .bar b { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--magenta)); }
      .empty { font: 0.82rem 'Mono', monospace; opacity: 0.55; }

      .funnel { display: grid; gap: 10px; }
      .step { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; font-size: 0.9rem; }
      .step .track { height: 22px; background: rgb(21 16 26 / 0.08); border-radius: 6px; overflow: hidden; }
      .step .track b { display: block; height: 100%; background: var(--c); border-radius: 6px; min-width: 2px; }
      .step .v { font: 700 0.85rem 'Mono', monospace; min-width: 5.5ch; text-align: right; }
      .note { font-size: 0.82rem; opacity: 0.65; margin: 12px 0 0; }
      footer { text-align: center; font: 0.74rem 'Mono', monospace; opacity: 0.6; padding-bottom: 36px; }
      .split { display: flex; height: 26px; border-radius: 7px; overflow: hidden; border: 2px solid var(--ink); margin: 4px 0 8px; }
      .split div { display: grid; place-items: center; font: 700 0.72rem 'Mono', monospace; color: var(--ink); }
      @media (max-width: 560px) { .step { grid-template-columns: 1fr auto; } .step .track { grid-column: 1 / -1; order: 3; } }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <h1>francio<span>house</span> <span class="hand" style="font-size: 0.4em; vertical-align: middle; letter-spacing: 0">· i numeri</span></h1>
        <div class="tools">
          <span id="demo" class="demo" hidden>dati finti</span>
          <button class="pill" data-days="7" aria-pressed="false">7 giorni</button>
          <button class="pill" data-days="30" aria-pressed="true">30 giorni</button>
          <button class="pill" data-days="90" aria-pressed="false">90 giorni</button>
          <button class="pill" id="refresh">Aggiorna</button>
        </div>
      </div>
      <div class="fringe" aria-hidden="true">
        <i style="color: #ffd23f"></i><i style="color: #ff8a1c"></i><i style="color: #f7f3ea"></i><i style="color: #ff7eb6"></i><i style="color: #e63a2e"></i><i style="color: #ffd23f"></i><i style="color: #9b5cff"></i>
      </div>
    </header>

    <main id="app">
      <p class="empty">Carico i numeri…</p>
    </main>
    <footer id="foot"></footer>
    <div class="tip" id="tip"></div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const nf = new Intl.NumberFormat('it-IT');
      // everything that comes from visitors (referrers, paths…) goes through text nodes, never innerHTML
      const el = (tag, props = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const [k, v] of Object.entries(props)) {
          if (k === 'class') e.className = v;
          else if (k === 'style') e.setAttribute('style', v);
          else e.setAttribute(k, v);
        }
        for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
        return e;
      };
      const svgEl = (tag, attrs = {}, ...kids) => {
        const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
        for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
        return e;
      };
      const pct = (a, b) => (b ? Math.round((a / b) * 100) + '%' : '–');

      let days = [7, 30, 90].includes(Number(new URLSearchParams(location.search).get('days'))) ? Number(new URLSearchParams(location.search).get('days')) : 30;
      let stale = false;

      function card(title, small, ...body) {
        return el('section', { class: 'card' }, el('h2', {}, title, small ? el('small', {}, small) : null), ...body);
      }
      function kpi(cls, value, label, sub) {
        return el('section', { class: 'card kpi ' + cls }, el('div', { class: 'n' }, value), el('div', { class: 'l' }, label), sub ? el('div', { class: 's' }, sub) : null);
      }
      function list(rows, color, nameKey = 'name', unit = '') {
        if (!rows || !rows.length) return el('p', { class: 'empty' }, 'Ancora niente');
        const max = Math.max(...rows.map((r) => r.count), 1);
        return el(
          'ul',
          { class: 'list' },
          rows.map((r) => el('li', { title: String(r[nameKey]) }, el('span', { class: 'name' }, r[nameKey]), el('span', { class: 'val' }, nf.format(r.count) + unit), el('span', { class: 'bar' }, el('b', { style: `width:${(r.count / max) * 100}%;--c:${color}` })))),
        );
      }

      function barChart(daily) {
        const W = 900, H = 240, L = 34, B = 26, T = 10;
        const max = Math.max(...daily.map((d) => d.count), 4);
        const top = Math.ceil(max / 4) * 4;
        const bw = (W - L) / daily.length;
        const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'chart', role: 'img', 'aria-label': 'Visite al giorno' });
        for (let i = 0; i <= 4; i++) {
          const y = T + (H - B - T) * (1 - i / 4);
          svg.append(svgEl('line', { x1: L, x2: W, y1: y, y2: y, stroke: 'rgb(21 16 26 / 0.12)', 'stroke-dasharray': i ? '3 4' : '0' }), svgEl('text', { x: L - 6, y: y + 4, 'text-anchor': 'end' }, Math.round((top * i) / 4)));
        }
        const tip = $('#tip');
        daily.forEach((d, i) => {
          const h = ((H - B - T) * d.count) / top;
          const x = L + i * bw;
          const wd = new Date(d.day + 'T12:00:00').getDay();
          const weekend = wd === 5 || wd === 6 || wd === 0;
          const bar = svgEl('rect', { x: x + bw * 0.12, y: H - B - h, width: bw * 0.76, height: Math.max(h, d.count ? 2 : 0), rx: 3, fill: weekend ? '#f28dba' : '#d3166d' });
          const hit = svgEl('rect', { x, y: T, width: bw, height: H - B - T, fill: 'transparent' });
          const show = (e) => {
            tip.textContent = `${new Date(d.day + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short' })} · ${d.count} visite`;
            tip.style.left = e.clientX + 12 + 'px';
            tip.style.top = e.clientY - 34 + 'px';
            tip.style.opacity = 1;
          };
          hit.addEventListener('mousemove', show);
          hit.addEventListener('mouseleave', () => (tip.style.opacity = 0));
          svg.append(bar, hit);
          const every = daily.length > 40 ? 14 : daily.length > 14 ? 5 : 1;
          if (i % every === 0) svg.append(svgEl('text', { x: x + bw / 2, y: H - 6, 'text-anchor': 'middle' }, new Date(d.day + 'T12:00:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'short' })));
        });
        return svg;
      }

      function funnel(d) {
        const home = Math.max(d.homeVisits, 1);
        const i = d.intro;
        const rows = [
          ['Arrivano sulla home', d.homeVisits, '#74c6f4'],
          ['Vedono la strada (intro)', i.seen, '#170f55'],
          ['↳ entrano col campanello', i.bell, '#d3166d'],
          ['↳ entrano scorrendo', i.scroll, '#f28dba'],
          ['↳ entrano con “salta”', i.skipped, '#ffd23f'],
          ['Tornano e non la vedono', i.returning, '#93e2b7'],
          ['Arrivano da un link diretto', i.direct, '#1f7a3c'],
          ['Escono di nuovo fuori', i.outside, '#9b5cff'],
        ];
        return el(
          'div',
          { class: 'funnel' },
          rows.map(([label, v, c]) => el('div', { class: 'step' }, el('span', {}, label), el('span', { class: 'track' }, el('b', { style: `width:${Math.min(100, (v / home) * 100)}%;--c:${c}` })), el('span', { class: 'v' }, nf.format(v)))),
        );
      }

      function render(d) {
        const app = $('#app');
        app.replaceChildren();
        $('#demo').hidden = !d.demo;
        if (stale) app.append(el('div', { class: 'warn' }, 'Il servizio sul Mac non risponde: questi sono gli ultimi numeri salvati. Per riaccenderlo: npm run stats:install'));
        if (d.warnings?.length) app.append(el('div', { class: 'warn' }, 'Qualche dato non è arrivato: ' + d.warnings.join(' · ')));

        const best = d.daily.reduce((a, b) => (b.count > a.count ? b : a), { count: -1 });
        const rsvpTotal = d.rsvp.reduce((a, r) => a + r.count, 0);
        const enPct = pct(d.enVisits, d.itVisits + d.enVisits);
        const i = d.intro;
        const entered = i.bell + i.scroll + i.skipped + i.failed;

        app.append(
          el(
            'div',
            { class: 'grid kpis' },
            kpi('k1', nf.format(d.totalVisits), 'visite alle pagine', `ultimi ${d.days} giorni`),
            kpi('k2', best.count > 0 ? nf.format(best.count) : '–', 'giorno più forte', best.count > 0 ? new Date(best.day + 'T12:00:00').toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }) : ''),
            kpi('k3', i.seen ? pct(entered, i.seen) : '–', 'entra dopo aver visto l’intro', i.seen ? `${nf.format(entered)} su ${nf.format(i.seen)} · ${nf.format(i.returning)} tornano e la saltano` : 'i nuovi conteggi partono dal primo giorno dopo l’aggiornamento'),
            kpi('k4', nf.format(rsvpTotal), 'clic su “Prenota”', `${nf.format(d.calendar.reduce((a, r) => a + r.count, 0))} aggiunte al calendario`),
            kpi('k5', enPct, 'legge in inglese', `${nf.format(d.enVisits)} visite alle pagine EN`),
          ),
          card('Visite al giorno', 'i fine settimana sono rosa', barChart(d.daily)),
          el('div', { class: 'grid two' }, card('Pagine più viste', null, list(d.pages.map((p) => ({ name: p.label, count: p.count })), '#d3166d')), card('Da dove arrivano', 'Instagram, WhatsApp, ricerche…', list(d.refs, '#1f7a3c'))),
          el(
            'div',
            { class: 'grid two' },
            card('L’ingresso in casa', 'rispetto alle visite alla home', funnel(d), el('p', { class: 'note' }, 'La home conta ogni visita. “Vedono la strada” è chi vede l’intro (prima visita); chi è già entrato una volta ci passa sopra e viene contato in “tornano”, e chi arriva da un link a una sezione in “link diretto”. Sono conteggi nuovi: i giorni precedenti non li hanno.')),
            card('Prenotazioni e calendario', 'clic, per serata', el('h3', { style: 'margin:0 0 8px;font-size:.85rem' }, 'Prenota'), list(d.rsvp, '#d3166d', 'label'), el('h3', { style: 'margin:16px 0 8px;font-size:.85rem' }, 'Aggiungi al calendario'), list(d.calendar, '#74c6f4', 'label'), d.links.length ? el('h3', { style: 'margin:16px 0 8px;font-size:.85rem' }, 'Link agli artisti') : null, d.links.length ? list(d.links, '#f28dba', 'label') : null),
          ),
          el('div', { class: 'grid three' }, card('Paesi', null, list(d.countries, '#170f55')), card('Dispositivi', null, list(d.systems, '#d3166d')), card('Browser', null, list(d.browsers, '#1f7a3c'))),
          el('div', { class: 'grid three' }, card('Schermi', null, list(d.sizes, '#74c6f4')), card('Lingue del browser', null, list(d.languages, '#f28dba')), card('Italiano e inglese', null, el('div', { class: 'split' }, el('div', { style: `background:#93e2b7;width:${100 - parseInt(enPct) || 100}%` }, 'IT'), el('div', { style: `background:#ffd23f;width:${parseInt(enPct) || 0}%` }, parseInt(enPct) > 4 ? 'EN' : '')), el('p', { class: 'note', style: 'margin:0' }, `${nf.format(d.itVisits)} visite in italiano, ${nf.format(d.enVisits)} in inglese. Il pulsante IT/EN è stato premuto ${nf.format(d.intro.lang)} volte.`))),
        );
        $('#foot').textContent = `Dati da ${d.code}.goatcounter.com · solo visite anonime, senza cookie · aggiornato alle ${new Date(d.generatedAt).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })}`;
      }

      async function load(fresh = false) {
        document.querySelectorAll('[data-days]').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.days) === days)));
        try {
          const r = await fetch(`/api/data?days=${days}${fresh ? '&fresh=1' : ''}`);
          stale = r.headers.get('X-Stale') === '1';
          const d = await r.json();
          if (d.error) throw new Error(d.error);
          render(d);
        } catch (e) {
          $('#app').replaceChildren(el('div', { class: 'warn' }, 'Non riesco a leggere i dati: ' + e.message));
        }
      }
      document.querySelectorAll('[data-days]').forEach((b) => b.addEventListener('click', () => { days = Number(b.dataset.days); load(); }));
      $('#refresh').addEventListener('click', () => load(true));
      load();
      // lets the dashboard open as an app and keep its shell when the service is off
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    </script>
  </body>
</html>
